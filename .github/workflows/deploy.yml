name: Build, Push & Deploy to Vultr

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set APP_VERSION
        run: echo "APP_VERSION=$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Analytics API (Laravel)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVER_IMAGE }}:${{ env.APP_VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVER_IMAGE }}:latest

      - name: Build & Push Analytics Client (React)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.CLIENT_IMAGE }}:${{ env.APP_VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.CLIENT_IMAGE }}:latest

  deploy:
    name: Deploy to Vultr
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Compute APP_VERSION for deploy
        run: echo "APP_VERSION=$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Deploy Analytics Client
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.SERVER_DIRECTORY }}
            export ANALYTICS_CLIENT_TAG='${{ env.APP_VERSION }}'
            echo "Pulling Analytics Client image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/analytics-client:${ANALYTICS_CLIENT_TAG}
            echo "Removing any stale containers..."
            docker rm -f analytics-client 2>/dev/null || true
            echo "Restarting Analytics Client..."
            ANALYTICS_CLIENT_TAG=${ANALYTICS_CLIENT_TAG} docker compose up -d --force-recreate analytics-client
          EOF

      - name: Deploy Analytics API
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.SERVER_DIRECTORY }}
            export ANALYTICS_API_TAG='${{ env.APP_VERSION }}'
            echo "Pulling Analytics API image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/analytics-api:${ANALYTICS_API_TAG}
            echo "Removing any stale containers..."
            docker rm -f analytics-api 2>/dev/null || true
            echo "Restarting Analytics API..."
            ANALYTICS_API_TAG=${ANALYTICS_API_TAG} docker compose up -d --force-recreate analytics-api
            echo "Waiting for API container to be ready..."
            sleep 10
            echo "Running database migrations..."
            docker exec analytics-api php artisan migrate --force
            echo "Running database seeders..."
            docker exec analytics-api php artisan db:seed --class=DemoUserSeeder --force
          EOF

      - name: Cleanup old images
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            for img in ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVER_IMAGE }} ${{ secrets.DOCKER_USERNAME }}/${{ secrets.CLIENT_IMAGE }}; do
              docker images \$img --format '{{.Tag}}' | grep -v latest | sort -r | tail -n +3 | xargs -r -I {} docker rmi \$img:{}
            done
            docker image prune -f
          "

      - name: Deployment Summary
        run: |
          echo "Deployment completed at $(date)"
